contract_id: DEVELOPMENT_EXECUTION_CONTRACT
version: "0.1"
status: CANONICAL

execution_identity:
  required: [DEV_EXECUTION_ID, DEV_TASK_ID, DEV_CONTEXT_PACKAGE_ID, CHANGE_PLAN_ID, CHANGE_PLAN_VERSION, ARCHITECTURE_BASELINE_VERSION, AUTHORITY_POLICY_VERSION, SKILL_CONTRACT_VERSIONS, REPOSITORY_BASE_REFS]

states:
  normal: [PROPOSED, CONTEXT_RESOLVING, CONTEXT_RESOLVED, PLANNING, PLAN_PROPOSED, AWAITING_PLAN_AUTHORITY, PLAN_APPROVED, REPOSITORY_PREPARING, IMPLEMENTING, CAPTURING_CHANGE, TESTING, REVIEWING, ARCHITECTURE_AUDIT, CONTEXT_AUDIT, PR_READY, RELEASE_EVALUATION, READY_FOR_RELEASE, AWAITING_RELEASE_AUTHORITY, RELEASING, RELEASED]
  exceptional: [BLOCKED, REWORK_REQUIRED, CONTEXT_CONFLICT, ARCHITECTURE_CONFLICT, GOVERNANCE_CONFLICT, REJECTED, ROLLBACK_REQUIRED, ROLLED_BACK]

hard_rules:
  - INVALID_OUTPUT -> NO_TRANSITION
  - SKILL_OUTPUT != AUTHORITY
  - CRITICAL_FAIL_CANNOT_BE_OFFSET
  - EVIDENCE_IS_VERSIONED_NOT_SILENTLY_MUTATED
  - IMPLEMENTATION_CHANGE_INVALIDATES_AFFECTED_DOWNSTREAM_EVIDENCE
  - PUBLICATION_CLASSIFICATION_UNKNOWN -> NO_PUBLIC_WRITE
  - REPOSITORY_NOT_IN_APPROVED_PLAN -> NO_WRITE
  - REQUIRED_HITL_MISSING -> NO_MERGE

recovery_readiness:
  values: [NOT_REQUIRED, REVERSIBLE, BACKUP_RESTORE_VERIFIED, FORWARD_RECOVERY_VERIFIED, CONDITIONALLY_RECOVERABLE, UNRECOVERABLE, UNKNOWN]
  release_blocking: [UNRECOVERABLE, UNKNOWN]
  conditional: CONDITIONALLY_RECOVERABLE_REQUIRES_EXPLICIT_AUTHORITY_EVALUATION
