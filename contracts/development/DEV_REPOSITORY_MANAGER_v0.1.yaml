skill_id: DEV_REPOSITORY_MANAGER
version: "0.1"
status: CANONICAL
purpose: "Perform governed Git/GitHub repository mechanics"
input_contract: [DEV_TASK, APPROVED_CHANGE_PLAN, DEV_CONTEXT_PACKAGE, REPOSITORY_REGISTRY, AUTHORITY_CONTEXT]
output_contract: REPOSITORY_OPERATION_RESULT
required_authority: [READ_REPOSITORY, CREATE_BRANCH, WRITE_BRANCH, CREATE_COMMIT, OPEN_PR, MERGE_PR, CREATE_TAG, CREATE_RELEASE, ROLLBACK_REF, DELETE_BRANCH]
stop_conditions: [UNREGISTERED_REPO, REPO_OUTSIDE_PLAN, BASE_MISMATCH, UNKNOWN_WORKTREE, LEAKAGE_FAIL, DEPENDENCY_DIRECTION_VIOLATION, MISSING_RELEASE_AUTHORITY]
escalation_conditions: [CHANGE_PLAN_REVISION, CROSS_REPO_CHANGE, GOVERNANCE_CHANGE_PROPOSAL]
evidence_requirements: [BASE_SHA, ACTUAL_DIFF, BRANCH, COMMIT_SHA, PR_REF, LEAKAGE_RESULT]
traceability: "DEV_TASK -> CHANGE_PLAN -> repository -> branch -> commit -> PR"
